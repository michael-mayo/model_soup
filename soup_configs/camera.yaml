# Soup member augmentation: camera sensor and optics.
#
# Simulates different capture devices: sensor noise (low light / high ISO),
# focus and motion blur, lens chromatic aberration, low resolution, lossy
# compression, greyscale or channel-swapped pipelines, slight viewpoint and
# lens-perspective differences. Colour/brightness jitter is kept low so the
# member specialises in device robustness.
#
# See lighting.yaml for the file format.

ultralytics:
  hsv_h: 0.01
  hsv_s: 0.3
  hsv_v: 0.2
  degrees: 5.0
  translate: 0.1
  scale: 0.4
  shear: 2.0
  perspective: 0.0005  # lens / sensor-plane tilt
  fliplr: 0.5
  bgr: 0.1             # RGB/BGR pipeline mix-ups
  mosaic: 0.5
  mixup: 0.0
  cutmix: 0.0

albumentations:
  - transform: GaussNoise           # read / thermal noise
    std_range: [0.02, 0.1]
    p: 0.3
  - transform: ISONoise             # high-ISO colour noise
    color_shift: [0.01, 0.05]
    intensity: [0.1, 0.5]
    p: 0.2
  - transform: MotionBlur           # hand / patient movement
    blur_limit: [3, 7]
    p: 0.15
  - transform: Defocus              # out-of-focus lens
    radius: [1, 3]
    p: 0.15
  - transform: ChromaticAberration  # cheap lenses
    p: 0.1
  - transform: Downscale            # low-resolution sensors
    scale_range: [0.4, 0.9]
    p: 0.2
  - transform: ImageCompression     # JPEG artefacts from export/transfer
    quality_range: [40, 95]
    p: 0.4
  - transform: Sharpen              # in-camera sharpening
    p: 0.1
  - transform: ToGray               # greyscale devices
    p: 0.05
